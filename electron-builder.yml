appId: com.aikobox.app
productName: AikoBox
directories:
  buildResources: build
files:
  - 'out/**/*'
  - 'resources/**/*'
  - 'LICENSE'
  - 'THIRD_PARTY_NOTICES.md'
  - 'licenses/**/*'
extraResources:
  - from: './extra/'
    to: ''
    filter:
      - 'files/**/*'
      - '!files/7za.exe'
      - '!files/enableLoopback.exe'
      - '!files/TrafficMonitor/**/*'
      - '!files/sub-store.bundle.js'
      - '!files/sub-store.bundle.cjs'
      - '!files/sub-store-frontend/**/*'
      - 'sidecar/**/*'
protocols:
  name: 'AikoBox URI Scheme'
  schemes:
    - 'clash'
    - 'mihomo'
    - 'aikobox'
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: aikobox-windows-${version}-${arch}-setup.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: false
  oneClick: false
  perMachine: true
  createDesktopShortcut: always
portable:
  artifactName: aikobox-windows-${version}-${arch}-portable.${ext}
  requestExecutionLevel: user
npmRebuild: true
publish: []
