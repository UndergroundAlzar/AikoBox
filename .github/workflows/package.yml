name: Windows package proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch and verify every locked runtime resource
        run: node scripts/prepare.mjs --x64
      - name: Test the locked resource verifier itself
        run: node --test scripts/prepare.test.mjs
      - name: Test the fail-closed third-party license audit
        run: pnpm run test:licenses
      - name: Test CI Electron smoke safety boundaries
        run: |
          pnpm run test:electron-smoke
          pnpm run test:electron-prod-smoke
      - name: Test final release extraction safety logic
        run: pnpm run test:verify-release
      - name: Require complete third-party redistribution evidence before packaging
        run: pnpm run audit:licenses
      - name: Require every translation key to resolve before packaging
        run: pnpm run audit:i18n
      - name: Rebuild native dependencies for Electron
        run: pnpm exec electron-builder install-app-deps
      - name: Run all tests including real sing-box config checks
        run: pnpm run test
      - name: Compile and package both Windows targets
        run: pnpm run build:win
      - name: Verify the exact release artifact set and checksums
        run: pnpm run verify:release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aikobox-windows-x64-${{ github.sha }}
          path: |
            dist/*-setup.exe
            dist/*-portable.exe
            dist/*.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
