name: 错误反馈
description: 报告可重复的 AikoBox Windows 或 Android 客户端问题
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传订阅链接、节点凭据、控制器密钥或未脱敏日志。安全漏洞请按 SECURITY.md 私密报告。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题。
          required: true
        - label: 我确认这是 AikoBox 界面、转换或集成问题，而不是单独的 sing-box 使用问题。
          required: true
        - label: 我没有为复现问题关闭安全软件，也没有中断当前维持联网的代理。
          required: true
        - label: 我已从配置、截图和日志中删除订阅、密码、令牌及个人信息。
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows x64
        - Android arm64-v8a
        - 实验 Android 客户端（mobile/）
    validations:
      required: true

  - type: input
    id: system_version
    attributes:
      label: 系统版本
      placeholder: 例如 Windows 11 24H2；Android 15
    validations:
      required: true

  - type: dropdown
    id: distribution
    attributes:
      label: 分发方式
      options:
        - Windows 安装版（setup）
        - Windows 便携版（portable）
        - Android Release APK
        - 本地开发构建
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AikoBox 版本
      placeholder: 例如 0.1.0
    validations:
      required: true

  - type: dropdown
    id: network_mode
    attributes:
      label: 问题发生时的模式
      options:
        - 未启用系统代理或 TUN
        - Windows 系统代理
        - Windows TUN
        - Android VPN
        - 不确定
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 请说明发生了什么，并附上已脱敏的错误文本。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 最小重现步骤
      description: 请从应用未运行或已知状态开始描述，不要粘贴完整订阅。
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏诊断信息
      description: 可选。粘贴相关日志片段、截图或配置结构；请再次检查其中没有秘密信息。

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
