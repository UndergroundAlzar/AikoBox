name: 功能请求
description: 为 AikoBox Windows 或 Android 客户端提出功能建议
title: '[Feature] '
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和路线讨论，未找到相同建议。
          required: true
        - label: 该建议适用于当前支持的 Windows x64 或 Android arm64-v8a 平台。
          required: true
        - label: 内容不包含订阅链接、账号、令牌或其他秘密信息。
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - Windows x64
        - Android arm64-v8a
        - Windows 与 Android
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前工作流中的具体困难，而不只是功能名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明期望的交互、默认行为，以及对系统代理或 TUN 安全性的影响。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
